[project]
name = "gemma4-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adk-eval-core",
    "adk-submission",
    "google-adk",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.31.3",
    "sentence-transformers>=6.1.0",
    "swegemma",
]

[tool.uv]
package = true

[tool.uv.sources]
swegemma = { path = "data/wheelhouse/swegemma-0.2.11-py3-none-any.whl" }
adk-submission = { path = "data/wheelhouse/adk_submission-0.2.13-py3-none-any.whl" }
adk-eval-core = { path = "data/wheelhouse/adk_eval_core-0.1.0-py3-none-any.whl" }
google-adk = { path = "data/wheelhouse/google_adk-1.36.1-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g4a"]
