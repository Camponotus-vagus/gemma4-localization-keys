# Per-task budgets read by the scorer (only these four keys are honoured).
# 7 min/task: public runs at 8 min finished in 8.9-11.9 h; 7 min keeps more margin
# under the 12 h cap. Rejected tool calls do not count toward max_tool_calls.
evaluation:
  timeout_seconds: 240
  max_tool_calls: 30
  max_time_minutes: 7
  max_turns: 80
